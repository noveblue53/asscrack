name: Check passive wire capture of the exact Windows RC1

on:
  push:
    branches: [codex/friend-pilot-encryption-verification]
    paths:
      - '.github/workflows/verify-windows-pilot.yml'
      - 'ci/windows-*.cjs'

permissions:
  contents: read

jobs:
  passive-capture:
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: write # Draft assets require repository write access to read.
    env:
      PILOT_EXE: ASSCRACK-0.7.0-friend-pilot-rc1-42cf3c6-windows-runner-x64.exe
      PILOT_SHA256: 567507aafaf63c209732b8144abd65a396d4570a339dab616b66e3d2b815048d
      PILOT_ENCRYPTION_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Verify the exact draft download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ASSCRACK wire capture'
          New-Item -ItemType Directory -Path $root
          gh release download v0.7.0-friend-pilot-rc1 --repo $env:GITHUB_REPOSITORY --pattern $env:PILOT_EXE --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Draft artifact download failed' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $env:PILOT_EXE)).Hash.ToLowerInvariant()
          if ($hash -ne $env:PILOT_SHA256) { throw "Unexpected executable digest $hash" }
          "Verified release executable SHA-256: $hash"
          "PILOT_TEST_ROOT=$root" >> $env:GITHUB_ENV
      - name: Extract the exact packaged app
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $root = $env:PILOT_TEST_ROOT
          & $sevenZip x -y (Join-Path $root $env:PILOT_EXE) "-o$root/launcher"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher extraction failed' }
          $embedded = @(Get-ChildItem (Join-Path $root 'launcher') -Recurse -Filter 'app-64.7z')
          if ($embedded.Count -ne 1) { throw 'Expected one embedded x64 payload' }
          $payload = Join-Path $root 'payload'
          & $sevenZip x -y $embedded[0].FullName "-o$payload"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged x64 payload extraction failed' }
      - name: Passively observe disposable loopback profiles
        run: |
          $root = $env:PILOT_TEST_ROOT
          $tooling = Join-Path $root 'tooling'
          npm install --prefix $tooling --no-audit --no-fund --no-package-lock --ignore-scripts playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'CDP client install failed' }
          $env:NODE_PATH = Join-Path $tooling 'node_modules'
          $evidencePath = Join-Path $root 'evidence.json'
          node ci/windows-packaged-pilot.cjs (Join-Path $root 'payload/ASSCRACK.exe') (Join-Path $root 'profiles') $evidencePath
          $captureExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $evidencePath) { Get-Content -Raw -LiteralPath $evidencePath }
          if ($captureExit -ne 0) { throw 'Passive capture check failed' }
