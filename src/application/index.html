<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>ASSCRACK</title>
</head>
<body>
  <section id="login-screen">
    <h1>ASSCRACK</h1>
    <p>Automated Server Switch in Case Relays Are Crashed or Killed</p>

    <label for="username">Username</label><br>
    <input type="text" id="username" placeholder="Enter your username"><br><br>

    <label for="room">Room</label><br>
    <input type="text" id="room" placeholder="Enter the room"><br><br>

    <button id="login">Log In</button>
  </section>

  <section id="chat-screen" hidden>
    <header id="chat-header">
      <span id="chat-user"></span> in <span id="chat-room"></span>
    </header>
    <div id="chat-body">
      <ul id="peers"></ul>
      <ul id="messages"></ul>
    </div>
    <div id="composer">
      <input type="text" id="message-input" placeholder="Type a message">
      <button id="send">Send</button>
    </div>
  </section>

  <p id="status"></p>
  <script src="voice.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
