<!doctype html>
<html lang="en" data-theme="aero-classic">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Asscrack Voice</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="voice-monitor.css">
</head>
<body>
  <main>
    <div class="mic-row">
      <strong id="mic" role="status">Connecting…</strong>
      <button type="button" id="mute" disabled>Mute</button>
    </div>
    <div class="share-row" id="share-row" hidden>
      <strong id="share-state" role="status">Sharing your screen</strong>
      <button type="button" id="stop-share">Stop sharing</button>
    </div>
    <h1>Speaking</h1>
    <div id="speakers" role="status">No one speaking</div>
    <button id="back" type="button">Return to room</button>
  </main>
  <script src="voice-monitor.js"></script>
</body>
</html>
